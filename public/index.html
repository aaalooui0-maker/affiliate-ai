<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Affiliate AI Generator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}
h1{
  text-align:center;
  margin-bottom:5px;
}
.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}
.card{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
label{
  display:block;
  font-weight:bold;
  margin:12px 0 7px;
}
input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
textarea{
  min-height:110px;
  resize:vertical;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}
button:hover{
  opacity:.9;
}
.result{
  white-space:pre-wrap;
  background:#fafafa;
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  line-height:1.6;
}
.copy{
  background:#333;
}
.small{
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 Affiliate AI</h1>
<div class="subtitle">
Generator Prompt Video + Hook + Caption + Hashtag
</div>

<div class="card">

<label>Nama Produk</label>
<input id="produk" placeholder="Contoh: Parfum Roll On Vanilla">

<label>Deskripsi / Caption Produk</label>
<textarea id="deskripsi"
placeholder="Masukkan deskripsi produk, keunggulan, ukuran, aroma, bahan, manfaat, atau informasi lainnya..."></textarea>

<label>Durasi Video</label>
<select id="durasi">
<option value="10">10 Detik</option>
<option value="15">15 Detik</option>
<option value="20" selected>20 Detik</option>
<option value="30">30 Detik</option>
</select>

<label>Gaya Video</label>
<select id="gaya">
<option value="Review">Review</option>
<option value="Soft Selling">Soft Selling</option>
<option value="Ngegas">Ngegas / FYP</option>
</select>

<label>Gaya Hook</label>
<select id="hook">
<option value="normal">Normal</option>
<option value="ngegas">Ngegas</option>
<option value="rekomendasi">Ada rekomendasi</option>
</select>

<button onclick="buatKonten()">✨ BUAT KONTEN AFFILIATE</button>

</div>

<div class="card" id="hasilCard" style="display:none">

<h2>🎬 Prompt Video</h2>
<div id="prompt" class="result"></div>

<h2>🪝 Hook</h2>
<div id="hookHasil" class="result"></div>

<h2>📝 Caption</h2>
<div id="caption" class="result"></div>

<h2>#️⃣ Hashtag</h2>
<div id="hashtag" class="result"></div>

<button class="copy" onclick="salinSemua()">📋 SALIN SEMUA</button>

</div>

</div>

<script>

function buatKonten(){

const produk=document.getElementById("produk").value.trim();
const deskripsi=document.getElementById("deskripsi").value.trim();
const durasi=document.getElementById("durasi").value;
const gaya=document.getElementById("gaya").value;
const tipeHook=document.getElementById("hook").value;

if(!produk){
alert("Masukkan nama produk terlebih dahulu.");
return;
}

let hook="";

if(tipeHook==="ngegas"){
hook=`JANGAN SKIP DULU! KALAU KALIAN LAGI CARI ${produk.toUpperCase()}, WAJIB LIHAT INI!`;
}

else if(tipeHook==="rekomendasi"){
hook=`ADA REKOMENDASI ${produk}? INI SALAH SATU YANG WAJIB KALIAN CEK!`;
}

else{
hook=`Lagi cari ${produk}? Coba lihat yang satu ini!`;
}

let prompt=`

VIDEO AFFILIATE

PRODUK:
${produk}

DURASI:
${durasi} detik

GAYA:
${gaya}

FORMAT:
9:16 vertikal, kualitas HD/2K, realistis, cocok untuk TikTok Affiliate.

INSTRUKSI:
Buat video review produk yang natural dan menarik.
Produk harus menjadi fokus utama.
Pertahankan bentuk, warna, tulisan, logo, kemasan,
dan detail produk sesuai referensi asli.

Gunakan gerakan kamera yang halus:
zoom in, zoom out, camera movement ringan,
dan beberapa angle produk.

VOICE OVER:
Bahasa Indonesia.
Suara natural, jelas, dan tidak kaku.

HOOK:
${hook}

INFORMASI PRODUK:
${deskripsi || "Gunakan informasi produk yang terlihat dari nama produk."}

AKHIR VIDEO:
Tampilkan produk dengan jelas dan tambahkan teks:

"CEK KERANJANG KUNING"

Jangan membuat klaim berlebihan.
Jangan menambahkan informasi produk yang tidak tersedia.
`;

let caption=
`🔥 ${produk} yang lagi wajib banget kalian cek!

Kalau kalian lagi cari produk seperti ini,
bisa banget masuk wishlist. 👀

${deskripsi ? deskripsi.substring(0,250) : "Cek detail produknya dan lihat apakah cocok buat kamu."}

👉 Cek produknya di keranjang kuning!`;

let hashtag=
`#affiliate #tiktokaffiliate #racuntiktok #fyp #fypシ #viral #rekomendasi #${produk.replace(/[^a-zA-Z0-9]/g,"").toLowerCase()}`;

document.getElementById("prompt").textContent=prompt.trim();
document.getElementById("hookHasil").textContent=hook;
document.getElementById("caption").textContent=caption;
document.getElementById("hashtag").textContent=hashtag;

document.getElementById("hasilCard").style.display="block";

}

function salinSemua(){

const semua=
`HOOK:
${document.getElementById("hookHasil").textContent}

PROMPT VIDEO:
${document.getElementById("prompt").textContent}

CAPTION:
${document.getElementById("caption").textContent}

HASHTAG:
${document.getElementById("hashtag").textContent}`;

navigator.clipboard.writeText(semua);

alert("Semua konten berhasil disalin!");

}

</script>

</body>
</html>
